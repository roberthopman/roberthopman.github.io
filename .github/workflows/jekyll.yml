# Builds and deploys the site using this repo's own Gemfile.
#
# This replaced GitHub Pages' legacy branch builds, which ignored the Gemfile
# and forced Jekyll 3.9.3 via the github-pages gem. That old stack also shipped
# jekyll-sass-converter 1.5.2 (Ruby Sass), which cannot parse the @use rules and
# color.adjust() calls in _sass/minima/. This workflow is what makes those work.
#
# Pages must be set to build_type=workflow for the deploy step to succeed:
#   gh api -X PUT repos/roberthopman/roberthopman.github.io/pages -f build_type=workflow
# To roll back to branch builds, set build_type=legacy. The Sass would then need
# reverting too, so prefer fixing forward.
name: Jekyll

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          # ruby-version is deliberately omitted. The action's default already
          # reads .ruby-version, which keeps CI and local on the same Ruby.
          # Do not add ruby-version-file: it is not a valid input for this
          # action and is ignored with a warning on every run.
          bundler-cache: true

      # No --baseurl override here on purpose. _config.yml sets baseurl: "" and
      # the site is served from the root of a custom domain, which is what
      # production already expects. Letting actions/configure-pages compute a
      # base_path risks rewriting every relative_url on the site.
      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      # include-hidden-files defaults to false, which adds --exclude=.[^/]* to
      # the action's tar and silently drops .well-known/ from the artifact.
      # Jekyll builds security.txt correctly; without this it never deploys.
      # .git and .github stay excluded regardless of this setting.
      - uses: actions/upload-pages-artifact@v5
        with:
          include-hidden-files: true

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
