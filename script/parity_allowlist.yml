# Differences between the Jekyll build and the Parklife build that are accepted
# on purpose. Every entry needs a reason. An empty list means the two builds
# must agree exactly.

# CSS selectors removed from the Jekyll side before comparison.
strip_from_jekyll:
  - selector: 'meta[name="generator"]'
    reason: "Jekyll advertises its own version in every page. Rails does not."

# Output paths excluded from comparison entirely.
# deprecating-til/index.html: {% highlight %} became a fenced code block, so
# Rouge now wraps it in div.language-*.highlighter-rouge instead of
# figure.highlight. The site's CSS styles .highlighter-rouge and never styled
# figure.highlight, so this is a visible fix, not a regression. Site owner
# sign-off: 2026-08-11.
#
# bug-report-template/index.html: jekyll-gist baked the string
# "404: Not Found" into the noscript fallback because it could not fetch the
# gist body at build time. The Rails version emits a working link to the
# gist instead. Site owner sign-off: 2026-08-12.
skip_paths:
  - "deprecating-til/index.html"
  - "bug-report-template/index.html"
