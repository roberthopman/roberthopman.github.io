# Differences between the Jekyll build and the Parklife build that are accepted
# on purpose. Every entry needs a reason. An empty list means the two builds
# must agree exactly.

# CSS selectors removed from the Jekyll side before comparison.
strip_from_jekyll:
  - selector: 'meta[name="generator"]'
    reason: "Jekyll advertises its own version in every page. Rails does not."

# Output paths excluded from comparison entirely.
# deprecating-til/index.html: {% highlight %} became a fenced code block, so
# Rouge now wraps it in div.language-*.highlighter-rouge instead of
# figure.highlight. The site's CSS styles .highlighter-rouge and never styled
# figure.highlight, so this is a visible fix, not a regression. Site owner
# sign-off: 2026-08-11.
#
# bug-report-template/index.html: jekyll-gist baked the string
# "404: Not Found" into the noscript fallback because it could not fetch the
# gist body at build time. The Rails version emits a working link to the
# gist instead. Site owner sign-off: 2026-08-12.
#
# AGENTS.md, CLAUDE.md, script/bootstrap, script/build, script/cibuild,
# script/server: Jekyll copied every front-matter-less file into _site,
# which published the repo's own agent instructions and build scripts.
# Nothing links to them and they are in no index. Site owner decided to
# stop serving them. Sign-off: 2026-08-11.
#
# assets/css/style.css.map: generated by the sass CLI rather than
# jekyll-sass-converter, so its contents differ from Jekyll's map. It is a
# developer-only artifact (source maps are read by browser devtools, not by
# any rendered page). Both builds publish the URL; only the content differs.
# Sign-off: 2026-08-12.
#
# assets/main.css, assets/main.css.map: main.css was an empty stylesheet
# (only a "/*# sourceMappingURL=main.css.map */" comment, no rules) that
# existed only to out-rank the minima theme gem's own copy of the same
# path. The theme gem is gone, so there is nothing left to out-rank, and
# nothing on the site links to either path. Site owner decided to stop
# serving them. Sign-off: 2026-08-12.
skip_paths:
  - "deprecating-til/index.html"
  - "bug-report-template/index.html"
  - "AGENTS.md"
  - "CLAUDE.md"
  - "script/bootstrap"
  - "script/build"
  - "script/cibuild"
  - "script/server"
  - "assets/css/style.css.map"
  - "assets/main.css"
  - "assets/main.css.map"

# Paths on which the literal build-time string is normalised away before
# comparison, independently on each side. feed.xml and sitemap.xml both
# embed site.time (the moment that side's build ran): the top-level
# <updated> in feed.xml, before the first <entry>, and the <lastmod> on
# every PAGE entry in sitemap.xml (post entries use the post's own date
# and are already stable). Two builds started at different instants can
# never be byte-identical on these two paths without this. It is not a
# pattern-based timestamp strip: script/parity reads each side's own
# feed.xml <updated> value and replaces only that exact string, only in
# these paths, only on that side, so a real change to a post's own date
# still shows up as differing. Approved 2026-08-12.
normalise_build_time:
  - "feed.xml"
  - "sitemap.xml"

# Paths compared as parsed XML rather than byte-for-byte: sibling element
# order is still preserved, and only whitespace-only text nodes collapse.
# sitemap.xml is generated as ordinary, readably-indented XML now, which
# Jekyll's own Liquid loop never was: Jekyll's {% if %} inside the page
# loop left an empty iteration's worth of whitespace behind for every page
# that failed the sitemap condition (Jekyll's own generated feed.xml/
# sitemap.xml/llms.txt pages, 404.html's sitemap: false, and two Sass
# entry-point pages jekyll-sass-converter also registers as pages), in an
# order tied to Jekyll's own site.pages read order (filesystem directory
# order, not something worth simulating on the Rails side for whitespace
# alone). Comparing structurally means indentation, blank-line placement
# and trailing whitespace no longer have to match byte for byte. Every
# <url> element's presence, its position relative to its siblings, and the
# text of its <loc>, <lastmod>, <changefreq> and <priority> are still
# compared exactly: nothing about element order or content is loosened.
# Approved 2026-08-12.
structural_xml:
  - "sitemap.xml"

# Attributes removed from BOTH sides before comparison. Unlike skip_paths,
# the rest of the page is still compared in full.
strip_attributes:
  - path: "archive/index.html"
    attribute: "data-words"
    reason: >
      Two posts (deprecating-til, bug-report-template) have approved content
      changes (see skip_paths above), which shifts their rendered word
      counts by a few words. data-words feeds only a client-side filter
      bucketed <400 / 400-800 / 800+, and every affected row stays in the
      same bucket either way, so the difference is not observable. Approved
      2026-08-12.
