<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Four scopes, four hard limits</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #fafaf7;
      --color-ink:     #111111;
      --color-muted:   #4b5563;
      --color-accent:  #0070f3;
      --font-sans:     'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      --font-serif:    'Instrument Serif', Georgia, 'Times New Roman', serif;
      --font-mono:     'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Nested · Diagram Design</p>
    <h1>Four scopes, four hard limits</h1>

    <svg viewBox="0 0 960 336" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="oop-rules-for-git-methods-and-classes-title oop-rules-for-git-methods-and-classes-desc">
      <title id="oop-rules-for-git-methods-and-classes-title">Four scopes, four hard limits</title>
      <desc id="oop-rules-for-git-methods-and-classes-desc">Nested diagram of the rule-based OOP checklist: a small conventional commit contains a class of at most 100 lines, which contains methods of at most 5 lines, which contain lines of at most 80 characters.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b5563"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0070f3"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b5563"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafaf7"/>

      <!-- Rings, outer to inner. Inset 32 horizontal, 36 vertical. Opaque fills so nothing needs a mask. -->
      <!-- Level 1: commit -->
      <rect x="40" y="40" width="880" height="256" rx="8" fill="#f7f7f4" stroke="rgba(17,17,17,0.30)" stroke-width="1"/>
      <!-- Level 2: class -->
      <rect x="72" y="76" width="816" height="184" rx="8" fill="#f2f2ef" stroke="rgba(17,17,17,0.45)" stroke-width="1"/>
      <!-- Level 3: method -->
      <rect x="104" y="112" width="752" height="112" rx="8" fill="#ecece9" stroke="#4b5563" stroke-width="1"/>
      <!-- Level 4: line, focal -->
      <rect x="136" y="148" width="688" height="40" rx="8" fill="rgba(0,112,243,0.08)" stroke="#0070f3" stroke-width="1"/>

      <!-- Level 1 band -->
      <text x="56" y="63" fill="#111111" font-size="12" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">Commit</text>
      <text x="128" y="63" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace">small and frequent · Conventional Commits</text>

      <!-- Level 2 band -->
      <text x="88" y="99" fill="#111111" font-size="12" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">Class</text>
      <text x="160" y="99" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace">max 100 lines · few public methods · helpers go private</text>

      <!-- Level 3 band -->
      <text x="120" y="135" fill="#111111" font-size="12" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">Method</text>
      <text x="192" y="135" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace">max 5 lines · few arguments · one return type · explicit errors · clear messages</text>

      <!-- Level 4 band, focal -->
      <text x="152" y="171" fill="#111111" font-size="12" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">Line</text>
      <text x="224" y="171" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace">max 80 characters</text>

      <!-- Editorial callout in the outer ring's bottom band -->
      <text x="904" y="284" fill="#4b5563" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" text-anchor="end">keep it simple and enforceable</text>
    </svg>
  </div>
</body>
</html>
