<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One request, four questions, one database</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #fafaf7;
      --color-ink:     #111111;
      --color-muted:   #4b5563;
      --color-accent:  #0070f3;
      --font-sans:     'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      --font-serif:    'Instrument Serif', Georgia, 'Times New Roman', serif;
      --font-mono:     'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Layer stack · Diagram Design</p>
    <h1>One request, four questions, one database</h1>

    <svg viewBox="0 0 960 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="building-a-b2b-crud-app-with-postgres-and-javascript-title building-a-b2b-crud-app-with-postgres-and-javascript-desc">
      <title id="building-a-b2b-crud-app-with-postgres-and-javascript-title">One request, four questions, one database</title>
      <desc id="building-a-b2b-crud-app-with-postgres-and-javascript-desc">Layer stack of the b2b-crud-app request path: route, controller, service, repository, Prisma client and PostgreSQL, with the file and the question each layer answers, and the service layer marked as focal.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b5563"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0070f3"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b5563"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafaf7"/>

      <!-- Direction column (left margin): the request travels down the stack -->
      <text x="40" y="68" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.18em">REQUEST</text>
      <line x1="80" y1="80" x2="80" y2="416" stroke="rgba(17,17,17,0.30)" stroke-width="1"/>
      <polygon points="76,416 84,416 80,424" fill="#4b5563"/>
      <text x="40" y="440" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.18em">SQL</text>

      <!-- 01 Route -->
      <rect x="120" y="80" width="800" height="56" fill="#f3f4f6"/>
      <line x1="120" y1="136" x2="920" y2="136" stroke="rgba(17,17,17,0.12)" stroke-width="1"/>
      <text x="140" y="112" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.14em">01</text>
      <text x="200" y="104" fill="#111111" font-size="14" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">Route</text>
      <text x="200" y="120" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace">routes/users.ts</text>
      <text x="900" y="112" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="end" letter-spacing="0.08em">which function handles this URL?</text>

      <!-- 02 Controller -->
      <rect x="120" y="136" width="800" height="56" fill="#fafaf7"/>
      <line x1="120" y1="192" x2="920" y2="192" stroke="rgba(17,17,17,0.12)" stroke-width="1"/>
      <text x="140" y="168" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.14em">02</text>
      <text x="200" y="160" fill="#111111" font-size="14" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">Controller</text>
      <text x="200" y="176" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace">controllers/userController.ts</text>
      <text x="900" y="168" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="end" letter-spacing="0.08em">how do I handle this HTTP request?</text>

      <!-- 03 Service (focal: the layer the tests target first) -->
      <rect x="120" y="192" width="800" height="56" fill="rgba(0,112,243,0.08)"/>
      <rect x="120" y="192" width="800" height="56" fill="none" stroke="#0070f3" stroke-width="1"/>
      <text x="140" y="224" fill="#0070f3" font-size="8" font-weight="600" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.14em">03</text>
      <text x="200" y="216" fill="#111111" font-size="14" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">Service</text>
      <text x="200" y="232" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace">services/userService.ts</text>
      <text x="900" y="224" fill="#0070f3" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="end" letter-spacing="0.08em">what business operation should happen?</text>

      <!-- 04 Repository -->
      <rect x="120" y="248" width="800" height="56" fill="#fafaf7"/>
      <line x1="120" y1="304" x2="920" y2="304" stroke="rgba(17,17,17,0.12)" stroke-width="1"/>
      <text x="140" y="280" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.14em">04</text>
      <text x="200" y="272" fill="#111111" font-size="14" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">Repository</text>
      <text x="200" y="288" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace">repositories/userRepo.ts</text>
      <text x="900" y="280" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="end" letter-spacing="0.08em">how do I get or save data?</text>

      <!-- 05 Prisma client -->
      <rect x="120" y="304" width="800" height="56" fill="#f3f4f6"/>
      <line x1="120" y1="360" x2="920" y2="360" stroke="rgba(17,17,17,0.12)" stroke-width="1"/>
      <text x="140" y="336" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.14em">05</text>
      <text x="200" y="328" fill="#111111" font-size="14" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">Prisma client</text>
      <text x="200" y="344" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace">lib/prisma.ts · schema.prisma</text>
      <text x="900" y="336" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="end" letter-spacing="0.08em">typed queries via adapter-pg</text>

      <!-- 06 PostgreSQL -->
      <rect x="120" y="360" width="800" height="56" fill="#fafaf7"/>
      <text x="140" y="392" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.14em">06</text>
      <text x="200" y="384" fill="#111111" font-size="14" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">PostgreSQL</text>
      <text x="200" y="400" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace">docker compose · 5433:5432</text>
      <text x="900" y="392" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="end" letter-spacing="0.08em">User · Project · ProjectMember</text>

      <!-- Outer silhouette -->
      <rect x="120" y="80" width="800" height="336" fill="none" stroke="#4b5563" stroke-width="1"/>

      <!-- Callout -->
      <text x="120" y="472" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.18em">FOUR STAGES</text>
      <text x="220" y="472" fill="#4b5563" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif">Stage 1 was one route handler. Stages 2, 3 and 4 split out the service, the controller and the repository.</text>
    </svg>
  </div>
</body>
</html>
