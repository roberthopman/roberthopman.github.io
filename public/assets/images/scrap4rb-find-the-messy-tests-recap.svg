<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 296" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scrap4rb-find-the-messy-tests-title scrap4rb-find-the-messy-tests-desc">
      <title id="scrap4rb-find-the-messy-tests-title">Test files in, one piece of advice per file out</title>
      <desc id="scrap4rb-find-the-messy-tests-desc">Diagram of scrap4rb as one chain: the Prism parser reads the test files, each test gets its smells and a score, the whole file gets totals and a check for tests that look alike, and that gives one piece of advice per file: leave it, fix some tests, make a table, or split the file.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b5563"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0070f3"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b5563"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafaf7"/>

      <!-- Zone: the gem, drawn before arrows and nodes -->
      <rect x="356" y="48" width="248" height="208" rx="8" fill="#111111" fill-opacity="0.02" stroke="#111111" stroke-opacity="0.10" stroke-width="0.8"/>
      <rect x="364" y="52" width="64" height="12" rx="2" fill="#f5f5f2"/>
      <text x="396" y="61" fill="#6b7280" font-size="7" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SCRAP4RB</text>

      <!-- Arrows first, behind boxes. One chain: test files, each test, the whole file, the advice. -->
      <path d="M 200,156 H 272 Q 280,156 280,148 V 116 Q 280,108 288,108 H 380" fill="none" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 480,136 V 176" fill="none" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 580,204 H 652 Q 660,204 660,196 V 164 Q 660,156 668,156 H 760" fill="none" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Node: Test files (input) -->
      <rect x="40" y="128" width="160" height="56" rx="6" fill="#fafaf7"/>
      <rect x="40" y="128" width="160" height="56" rx="6" fill="#4b5563" fill-opacity="0.10" stroke="#6b7280" stroke-width="1"/>
      <rect x="48" y="136" width="32" height="12" rx="2" fill="none" stroke="#6b7280" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="64" y="145" fill="#6b7280" font-size="7" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TESTS</text>
      <text x="120" y="160" fill="#111111" font-size="12" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">Test files</text>
      <text x="120" y="175" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">test/**/*_test.rb</text>

      <!-- Node: Each test (step 1) -->
      <rect x="380" y="80" width="200" height="56" rx="6" fill="#fafaf7"/>
      <rect x="380" y="80" width="200" height="56" rx="6" fill="#111111" fill-opacity="0.05" stroke="#4b5563" stroke-width="1"/>
      <rect x="388" y="88" width="28" height="12" rx="2" fill="none" stroke="#4b5563" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="402" y="97" fill="#4b5563" font-size="7" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AST</text>
      <text x="480" y="112" fill="#111111" font-size="12" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">Each test</text>
      <text x="480" y="127" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">smells · branches · a score</text>

      <!-- Node: Whole file (step 2) -->
      <rect x="380" y="176" width="200" height="56" rx="6" fill="#fafaf7"/>
      <rect x="380" y="176" width="200" height="56" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1"/>
      <rect x="388" y="184" width="28" height="12" rx="2" fill="none" stroke="#111111" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="402" y="193" fill="#4b5563" font-size="7" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FILE</text>
      <text x="480" y="208" fill="#111111" font-size="12" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">Whole file</text>
      <text x="480" y="223" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">totals · look-alike tests</text>

      <!-- Node: Advice per file (focal) -->
      <rect x="760" y="128" width="160" height="56" rx="6" fill="#fafaf7"/>
      <rect x="760" y="128" width="160" height="56" rx="6" fill="#0070f3" fill-opacity="0.08" stroke="#0070f3" stroke-width="1"/>
      <rect x="768" y="136" width="44" height="12" rx="2" fill="none" stroke="#0070f3" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="790" y="145" fill="#0070f3" font-size="7" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ADVICE</text>
      <text x="840" y="160" fill="#111111" font-size="12" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">Advice per file</text>
      <text x="840" y="175" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">leave · fix · table · split</text>
    </svg>
