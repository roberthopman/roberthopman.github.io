<svg viewBox="0 0 1040 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sdlc-cycle-title sdlc-cycle-desc">
<title id="sdlc-cycle-title">One slice, from request to e-mail</title>
<desc id="sdlc-cycle-desc">Thirteen steps on one circle: request, evidence, real confirmed examples, plan, engineering review, build red then green, mutation check, test-quality scan, full checks, PR, merge and deploy, production check, e-mail. Five steps are blue: there the human decides. The e-mail closes the circle, because its answer is the next request.</desc>
