<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 412" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wem-widgets-title wem-widgets-desc">
      <title id="wem-widgets-title">Custom code inside a no-code platform</title>
      <desc id="wem-widgets-desc">Nested diagram of the WEM platform: interaction nodes sit inside the platform, the widget editor sits inside a node, and your custom JavaScript, WEMscript and CSS sit at the innermost level.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b5563"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0070f3"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b5563"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafaf7"/>

      <!-- Level 1: the platform, outermost, faint -->
      <rect x="40" y="48" width="880" height="296" rx="8" fill="#111111" fill-opacity="0.015" stroke="#111111" stroke-opacity="0.30" stroke-width="1"/>
      <!-- Level 2: interaction nodes -->
      <rect x="72" y="84" width="816" height="224" rx="8" fill="#111111" fill-opacity="0.02" stroke="#111111" stroke-opacity="0.40" stroke-width="1"/>
      <!-- Level 3: widget editor -->
      <rect x="104" y="120" width="752" height="152" rx="8" fill="#111111" fill-opacity="0.03" stroke="#4b5563" stroke-width="1"/>
      <!-- Level 4: custom code, innermost, focal -->
      <rect x="136" y="156" width="688" height="80" rx="8" fill="#0070f3" fill-opacity="0.08" stroke="#0070f3" stroke-width="1"/>

      <!-- Level labels on masks over each ring's top border -->
      <rect x="56" y="40" width="152" height="16" fill="#fafaf7"/>
      <text x="64" y="52" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.14em">WEM PLATFORM · NO-CODE</text>

      <rect x="88" y="76" width="320" height="16" fill="#f6f6f3"/>
      <text x="96" y="88" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.14em">INTERACTION NODES · DOM · DATABASE · LOGIC · FLOWS</text>

      <rect x="120" y="112" width="316" height="16" fill="#f5f5f2"/>
      <text x="128" y="124" fill="#111111" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.14em">WIDGET EDITOR · SCRIPT · LAYOUT · NODE REFERENCES</text>

      <rect x="152" y="148" width="272" height="16" fill="#f3f3f0"/>
      <text x="160" y="160" fill="#0070f3" font-size="8" font-weight="600" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.14em">CUSTOM CODE · JAVASCRIPT · WEMSCRIPT · CSS</text>

      <!-- Innermost content -->
      <text x="480" y="194" fill="#111111" font-size="12" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">Your widget code</text>
      <text x="480" y="210" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">&lt;? if (@A &gt; @B) then ?&gt;transform: rotateY(180deg);&lt;? end ?&gt;</text>

      <!-- Editorial callout -->
      <text x="40" y="372" fill="#111111" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif">Each step deeper showed more familiar parts. In the end it was mostly plain JavaScript.</text>
    </svg>
