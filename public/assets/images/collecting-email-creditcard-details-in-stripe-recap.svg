<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="stripe-setupintent-title stripe-setupintent-desc">
      <title id="stripe-setupintent-title">Save a card now, charge it later</title>
      <desc id="stripe-setupintent-desc">Sequence diagram of a Stripe SetupIntent: the Rails app creates a SetupIntent, the customer confirms the card with Stripe directly, Stripe saves the payment method, and a later PaymentIntent charges it off-session.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b5563"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0070f3"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b5563"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafaf7"/>

      <!-- Lifelines: Customer 160, Rails app 480, Stripe 800 -->
      <line x1="160" y1="128" x2="160" y2="584" stroke="#111111" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="480" y1="128" x2="480" y2="584" stroke="#111111" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="800" y1="128" x2="800" y2="584" stroke="#111111" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- OPT fragment: the later charge -->
      <rect x="440" y="448" width="400" height="124" rx="4" fill="#111111" fill-opacity="0.02" stroke="#111111" stroke-opacity="0.22" stroke-width="1"/>
      <rect x="440" y="448" width="40" height="16" rx="2" fill="#fafaf7" stroke="#111111" stroke-opacity="0.22" stroke-width="1"/>
      <text x="460" y="460" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.12em">OPT</text>
      <text x="452" y="480" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.04em">[later, when charging]</text>

      <!-- Activation bars -->
      <rect x="476" y="180" width="8" height="144" fill="#111111" fill-opacity="0.06" stroke="#4b5563" stroke-width="0.8"/>
      <rect x="796" y="228" width="8" height="48" fill="#111111" fill-opacity="0.06" stroke="#4b5563" stroke-width="0.8"/>
      <rect x="796" y="372" width="8" height="48" fill="#111111" fill-opacity="0.06" stroke="#4b5563" stroke-width="0.8"/>
      <rect x="476" y="508" width="8" height="48" fill="#111111" fill-opacity="0.06" stroke="#4b5563" stroke-width="0.8"/>
      <rect x="796" y="508" width="8" height="48" fill="#111111" fill-opacity="0.06" stroke="#4b5563" stroke-width="0.8"/>

      <!-- Messages, time flows down -->
      <line x1="160" y1="176" x2="476" y2="176" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="484" y1="224" x2="796" y2="224" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="796" y1="272" x2="484" y2="272" stroke="#4b5563" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="476" y1="320" x2="160" y2="320" stroke="#4b5563" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="160" y1="368" x2="796" y2="368" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="796" y1="416" x2="160" y2="416" stroke="#0070f3" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="484" y1="504" x2="796" y2="504" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="796" y1="552" x2="484" y2="552" stroke="#4b5563" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- Message labels, masked, 6px above the stroke -->
      <rect x="272" y="160" width="92" height="12" rx="2" fill="#fafaf7"/>
      <text x="318" y="170" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OPEN CARD FORM</text>

      <rect x="572" y="208" width="136" height="12" rx="2" fill="#fafaf7"/>
      <text x="640" y="218" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POST /V1/SETUP_INTENTS</text>

      <rect x="596" y="256" width="88" height="12" rx="2" fill="#fafaf7"/>
      <text x="640" y="266" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLIENT_SECRET</text>

      <rect x="252" y="304" width="132" height="12" rx="2" fill="#fafaf7"/>
      <text x="318" y="314" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FORM + CLIENT_SECRET</text>

      <rect x="260" y="352" width="116" height="12" rx="2" fill="#fafaf7"/>
      <text x="318" y="362" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CONFIRMCARDSETUP</text>

      <rect x="568" y="400" width="144" height="12" rx="2" fill="#fafaf7"/>
      <text x="640" y="410" fill="#0070f3" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PAYMENT METHOD SAVED</text>

      <rect x="560" y="488" width="160" height="12" rx="2" fill="#f5f5f2"/>
      <text x="640" y="498" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POST /V1/PAYMENT_INTENTS</text>

      <rect x="564" y="536" width="152" height="12" rx="2" fill="#f5f5f2"/>
      <text x="640" y="546" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SUCCEEDED · OFF_SESSION</text>

      <!-- Actors -->
      <rect x="80" y="72" width="160" height="56" rx="6" fill="#fafaf7"/>
      <rect x="80" y="72" width="160" height="56" rx="6" fill="#4b5563" fill-opacity="0.10" stroke="#6b7280" stroke-width="1"/>
      <rect x="88" y="80" width="32" height="12" rx="2" fill="none" stroke="#6b7280" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="104" y="89" fill="#6b7280" font-size="7" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
      <text x="160" y="104" fill="#111111" font-size="12" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">Customer</text>
      <text x="160" y="119" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">Browser · Stripe.js</text>

      <rect x="400" y="72" width="160" height="56" rx="6" fill="#fafaf7"/>
      <rect x="400" y="72" width="160" height="56" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1"/>
      <rect x="408" y="80" width="28" height="12" rx="2" fill="none" stroke="#111111" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="422" y="89" fill="#4b5563" font-size="7" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
      <text x="480" y="104" fill="#111111" font-size="12" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">Rails app</text>
      <text x="480" y="119" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">stripe gem · server</text>

      <rect x="720" y="72" width="160" height="56" rx="6" fill="#fafaf7"/>
      <rect x="720" y="72" width="160" height="56" rx="6" fill="#0070f3" fill-opacity="0.08" stroke="#0070f3" stroke-width="1"/>
      <rect x="728" y="80" width="28" height="12" rx="2" fill="none" stroke="#0070f3" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="742" y="89" fill="#0070f3" font-size="7" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="800" y="104" fill="#111111" font-size="12" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">Stripe</text>
      <text x="800" y="119" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">SetupIntent · PaymentIntent</text>

      <!-- Legend -->
      <line x1="80" y1="600" x2="880" y2="600" stroke="#111111" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="80" y="616" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="80" y="634" width="14" height="10" rx="2" fill="#0070f3" fill-opacity="0.08" stroke="#0070f3" stroke-width="1"/>
      <text x="100" y="642" fill="#4b5563" font-size="8.5" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">Stores the card</text>
      <rect x="212" y="630" width="4" height="18" fill="#111111" fill-opacity="0.06" stroke="#4b5563" stroke-width="0.8"/>
      <text x="224" y="642" fill="#4b5563" font-size="8.5" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">Activation</text>
      <line x1="332" y1="640" x2="360" y2="640" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="368" y="642" fill="#4b5563" font-size="8.5" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">Request</text>
      <line x1="452" y1="640" x2="480" y2="640" stroke="#4b5563" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="488" y="642" fill="#4b5563" font-size="8.5" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">Return</text>
      <line x1="572" y1="640" x2="600" y2="640" stroke="#0070f3" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="608" y="642" fill="#4b5563" font-size="8.5" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">Card saved for a later charge</text>
    </svg>
