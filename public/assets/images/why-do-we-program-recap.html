<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programming makes slow work fast</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #fafaf7;
      --color-ink:     #111111;
      --color-muted:   #4b5563;
      --color-accent:  #0070f3;
      --font-sans:     'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      --font-serif:    'Instrument Serif', Georgia, 'Times New Roman', serif;
      --font-mono:     'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Programming makes slow work fast</h1>

    <svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="why-do-we-program-title why-do-we-program-desc">
      <title id="why-do-we-program-title">Programming makes slow work fast</title>
      <desc id="why-do-we-program-desc">Diagram of five ways we program, all of which make slow work fast, which frees time for more valuable things and makes new work practical.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b5563"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0070f3"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b5563"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafaf7"/>

      <!-- Column eyebrows -->
      <text x="156" y="56" fill="#6b7280" font-size="7" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.14em">THE FIVE WAYS</text>
      <text x="468" y="56" fill="#6b7280" font-size="7" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.14em">THE MECHANISM</text>
      <text x="784" y="56" fill="#6b7280" font-size="7" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.14em">THE PAYOFF</text>

      <!-- Arrows first, behind the nodes. Five ways fan into the mechanism at 16px spaced attach points -->
      <path d="M 256,96 H 324 Q 332,96 332,104 V 216 Q 332,224 340,224 H 368" fill="none" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 256,176 H 308 Q 316,176 316,184 V 232 Q 316,240 324,240 H 368" fill="none" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="256" y1="256" x2="368" y2="256" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 256,336 H 308 Q 316,336 316,328 V 280 Q 316,272 324,272 H 368" fill="none" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 256,416 H 324 Q 332,416 332,408 V 296 Q 332,288 340,288 H 368" fill="none" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- The mechanism fans out to two payoffs -->
      <path d="M 568,240 H 604 Q 612,240 612,232 V 224 Q 612,216 620,216 H 664" fill="none" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 568,272 H 616 Q 624,272 624,280 V 288 Q 624,296 632,296 H 664" fill="none" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- The five ways -->
      <rect x="56" y="72" width="200" height="48" rx="6" fill="#fafaf7"/>
      <rect x="56" y="72" width="200" height="48" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1"/>
      <text x="156" y="94" fill="#111111" font-size="12" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">Speed up known answers</text>
      <text x="156" y="109" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">the solution path is known</text>

      <rect x="56" y="152" width="200" height="48" rx="6" fill="#fafaf7"/>
      <rect x="56" y="152" width="200" height="48" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1"/>
      <text x="156" y="174" fill="#111111" font-size="12" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">Automate tedious tasks</text>
      <text x="156" y="189" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">the method is known</text>

      <rect x="56" y="232" width="200" height="48" rx="6" fill="#fafaf7"/>
      <rect x="56" y="232" width="200" height="48" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1"/>
      <text x="156" y="254" fill="#111111" font-size="12" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">Speed up communication</text>
      <text x="156" y="269" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">with other technology</text>

      <rect x="56" y="312" width="200" height="48" rx="6" fill="#fafaf7"/>
      <rect x="56" y="312" width="200" height="48" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1"/>
      <text x="156" y="334" fill="#111111" font-size="12" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">Create tools</text>
      <text x="156" y="349" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">singly or in combination</text>

      <rect x="56" y="392" width="200" height="48" rx="6" fill="#fafaf7"/>
      <rect x="56" y="392" width="200" height="48" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1"/>
      <text x="156" y="414" fill="#111111" font-size="12" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">Create frameworks</text>
      <text x="156" y="429" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">understand · discover · play</text>

      <!-- The mechanism (focal) -->
      <rect x="368" y="208" width="200" height="96" rx="6" fill="#fafaf7"/>
      <rect x="368" y="208" width="200" height="96" rx="6" fill="rgba(0,112,243,0.08)" stroke="#0070f3" stroke-width="1"/>
      <text x="468" y="246" fill="#111111" font-size="12" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">Make slow work fast</text>
      <text x="468" y="263" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">days by hand become seconds</text>
      <text x="468" y="278" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">not: replace people</text>

      <!-- The payoff -->
      <rect x="664" y="192" width="240" height="48" rx="6" fill="#fafaf7"/>
      <rect x="664" y="192" width="240" height="48" rx="6" fill="rgba(17,17,17,0.03)" stroke="rgba(17,17,17,0.30)" stroke-width="1"/>
      <text x="784" y="214" fill="#111111" font-size="12" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">Time for more valuable things</text>
      <text x="784" y="229" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">the known work, done faster</text>

      <rect x="664" y="272" width="240" height="48" rx="6" fill="#fafaf7"/>
      <rect x="664" y="272" width="240" height="48" rx="6" fill="rgba(17,17,17,0.03)" stroke="rgba(17,17,17,0.30)" stroke-width="1"/>
      <text x="784" y="294" fill="#111111" font-size="12" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">Newly practical work</text>
      <text x="784" y="309" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">barriers drop · costs fall</text>

      <!-- Legend -->
      <line x1="40" y1="456" x2="920" y2="456" stroke="rgba(17,17,17,0.10)" stroke-width="0.8"/>
      <text x="40" y="472" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="40" y="488" width="14" height="10" rx="2" fill="rgba(0,112,243,0.08)" stroke="#0070f3" stroke-width="1"/>
      <text x="60" y="496" fill="#4b5563" font-size="8.5" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">The mechanism</text>
      <rect x="180" y="488" width="14" height="10" rx="2" fill="#ffffff" stroke="#111111" stroke-width="1"/>
      <text x="200" y="496" fill="#4b5563" font-size="8.5" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">A way we program</text>
      <rect x="320" y="488" width="14" height="10" rx="2" fill="rgba(17,17,17,0.03)" stroke="rgba(17,17,17,0.30)" stroke-width="1"/>
      <text x="340" y="496" fill="#4b5563" font-size="8.5" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">A payoff</text>
      <line x1="428" y1="493" x2="456" y2="493" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="464" y="496" fill="#4b5563" font-size="8.5" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">Leads to</text>
    </svg>
  </div>
</body>
</html>
