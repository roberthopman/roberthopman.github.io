<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 612" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deprecating-til-title deprecating-til-desc">
      <title id="deprecating-til-title">Prototype with an AI agent, one feature at a time</title>
      <desc id="deprecating-til-desc">Flowchart of a prototype loop with an AI agent: build one feature, check that it works, append it to the spec and commit, fix a failure, and rebuild from a new spec after repeated failures.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b5563"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0070f3"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b5563"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafaf7"/>

      <!-- Arrows first, behind the nodes. Main column x=400, fix at x=160, append at x=680 -->
      <line x1="400" y1="88" x2="400" y2="120" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="400" y1="168" x2="400" y2="200" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="248" x2="600" y2="248" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 680,224 V 152 Q 680,144 672,144 H 480" fill="none" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="400" y1="296" x2="400" y2="328" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="300" y1="376" x2="240" y2="376" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 160,352 V 256 Q 160,248 168,248 H 300" fill="none" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="400" y1="424" x2="400" y2="456" stroke="#0070f3" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Branch and loop labels, masked, 8px clear of the stroke -->
      <rect x="534" y="228" width="32" height="12" rx="2" fill="#fafaf7"/>
      <text x="550" y="238" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

      <rect x="536" y="124" width="80" height="12" rx="2" fill="#fafaf7"/>
      <text x="576" y="134" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NEXT FEATURE</text>

      <rect x="408" y="306" width="24" height="12" rx="2" fill="#fafaf7"/>
      <text x="420" y="316" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

      <rect x="258" y="356" width="24" height="12" rx="2" fill="#fafaf7"/>
      <text x="270" y="366" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

      <rect x="168" y="298" width="72" height="12" rx="2" fill="#fafaf7"/>
      <text x="204" y="308" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CHECK AGAIN</text>

      <rect x="408" y="434" width="32" height="12" rx="2" fill="#fafaf7"/>
      <text x="424" y="444" fill="#0070f3" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

      <!-- Start oval -->
      <rect x="320" y="40" width="160" height="48" rx="24" fill="#fafaf7"/>
      <rect x="320" y="40" width="160" height="48" rx="24" fill="#111111" fill-opacity="0.03" stroke="#111111" stroke-opacity="0.30" stroke-width="1"/>
      <text x="400" y="62" fill="#111111" font-size="12" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">New prototype</text>
      <text x="400" y="77" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">spec.md · git init</text>

      <!-- Step: build one feature -->
      <rect x="320" y="120" width="160" height="48" rx="6" fill="#fafaf7"/>
      <rect x="320" y="120" width="160" height="48" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1"/>
      <text x="400" y="142" fill="#111111" font-size="12" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">Build one feature</text>
      <text x="400" y="157" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">with the AI agent</text>

      <!-- Decision 1 -->
      <polygon points="400,200 500,248 400,296 300,248" fill="#ffffff" stroke="#111111" stroke-width="1"/>
      <text x="400" y="246" fill="#111111" font-size="11" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">Does it</text>
      <text x="400" y="260" fill="#111111" font-size="11" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">work?</text>

      <!-- Step: append to the spec -->
      <rect x="600" y="224" width="160" height="48" rx="6" fill="#fafaf7"/>
      <rect x="600" y="224" width="160" height="48" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1"/>
      <text x="680" y="246" fill="#111111" font-size="12" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">Append it to spec.md</text>
      <text x="680" y="261" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">then commit</text>

      <!-- Decision 2 -->
      <polygon points="400,328 500,376 400,424 300,376" fill="#ffffff" stroke="#111111" stroke-width="1"/>
      <text x="400" y="374" fill="#111111" font-size="11" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">Failed several</text>
      <text x="400" y="388" fill="#111111" font-size="11" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">times in a row?</text>

      <!-- Step: fix it -->
      <rect x="80" y="352" width="160" height="48" rx="6" fill="#fafaf7"/>
      <rect x="80" y="352" width="160" height="48" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1"/>
      <text x="160" y="374" fill="#111111" font-size="12" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">Fix it</text>
      <text x="160" y="389" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">by hand, or ask the agent</text>

      <!-- Focal end oval: rebuild from a new spec -->
      <rect x="300" y="456" width="200" height="56" rx="28" fill="#fafaf7"/>
      <rect x="300" y="456" width="200" height="56" rx="28" fill="#0070f3" fill-opacity="0.08" stroke="#0070f3" stroke-width="1"/>
      <text x="400" y="482" fill="#111111" font-size="12" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">Rebuild from spec2.md</text>
      <text x="400" y="497" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">a new, more integrated spec</text>

      <!-- Legend -->
      <line x1="40" y1="528" x2="920" y2="528" stroke="#111111" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="544" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>
      <rect x="40" y="560" width="24" height="12" rx="6" fill="#111111" fill-opacity="0.03" stroke="#111111" stroke-opacity="0.30" stroke-width="1"/>
      <text x="72" y="570" fill="#4b5563" font-size="8.5" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">Start / end (oval)</text>
      <rect x="220" y="560" width="24" height="12" rx="2" fill="#ffffff" stroke="#111111" stroke-width="1"/>
      <text x="252" y="570" fill="#4b5563" font-size="8.5" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">Step (rectangle)</text>
      <polygon points="412,566 424,560 436,566 424,572" fill="#ffffff" stroke="#111111" stroke-width="1"/>
      <text x="448" y="570" fill="#4b5563" font-size="8.5" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">Decision (diamond)</text>
      <line x1="604" y1="566" x2="632" y2="566" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="640" y="570" fill="#4b5563" font-size="8.5" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">Branch or loop</text>
      <line x1="760" y1="566" x2="788" y2="566" stroke="#0070f3" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="796" y="570" fill="#4b5563" font-size="8.5" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">Escape hatch</text>
    </svg>
