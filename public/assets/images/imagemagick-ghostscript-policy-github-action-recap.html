<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Let convert read a PDF on GitHub Actions</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #fafaf7;
      --color-ink:     #111111;
      --color-muted:   #4b5563;
      --color-accent:  #0070f3;
      --font-sans:     'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      --font-serif:    'Instrument Serif', Georgia, 'Times New Roman', serif;
      --font-mono:     'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>Let convert read a PDF on GitHub Actions</h1>

    <svg viewBox="0 0 960 588" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="imagemagick-ghostscript-policy-github-action-title imagemagick-ghostscript-policy-github-action-desc">
      <title id="imagemagick-ghostscript-policy-github-action-title">Let convert read a PDF on GitHub Actions</title>
      <desc id="imagemagick-ghostscript-policy-github-action-desc">Flowchart for an ImageMagick convert error on GitHub Actions: check that the policy allows the PDF coder, check that Ghostscript is installed, apply the missing fix and retry.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b5563"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0070f3"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b5563"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafaf7"/>

      <!-- Arrows first, behind the nodes. Main column x=328, fixes at x=628 -->
      <line x1="328" y1="88" x2="328" y2="120" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="428" y1="168" x2="528" y2="168" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="328" y1="216" x2="328" y2="280" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 628,192 V 240 Q 628,248 620,248 H 334" fill="none" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="428" y1="328" x2="528" y2="328" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="328" y1="376" x2="328" y2="440" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 628,352 V 400 Q 628,408 620,408 H 334" fill="none" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Branch labels, masked, 8px clear of the stroke -->
      <rect x="466" y="148" width="24" height="12" rx="2" fill="#fafaf7"/>
      <text x="478" y="158" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

      <rect x="336" y="226" width="32" height="12" rx="2" fill="#fafaf7"/>
      <text x="352" y="236" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

      <rect x="466" y="308" width="24" height="12" rx="2" fill="#fafaf7"/>
      <text x="478" y="318" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

      <rect x="336" y="386" width="32" height="12" rx="2" fill="#fafaf7"/>
      <text x="352" y="396" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

      <!-- Merge points where a fix rejoins the main path -->
      <circle cx="328" cy="248" r="4" fill="#111111"/>
      <circle cx="328" cy="408" r="4" fill="#111111"/>

      <!-- Start oval -->
      <rect x="248" y="40" width="160" height="48" rx="24" fill="#fafaf7"/>
      <rect x="248" y="40" width="160" height="48" rx="24" fill="rgba(17,17,17,0.03)" stroke="rgba(17,17,17,0.30)" stroke-width="1"/>
      <text x="328" y="62" fill="#111111" font-size="12" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">convert fails</text>
      <text x="328" y="77" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">no images defined</text>

      <!-- Decision 1 -->
      <polygon points="328,120 428,168 328,216 228,168" fill="#ffffff" stroke="#111111" stroke-width="1"/>
      <text x="328" y="166" fill="#111111" font-size="11" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">Policy allows</text>
      <text x="328" y="180" fill="#111111" font-size="11" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">the PDF coder?</text>

      <!-- Fix 1: policy -->
      <rect x="528" y="144" width="200" height="48" rx="6" fill="#fafaf7"/>
      <rect x="528" y="144" width="200" height="48" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1"/>
      <text x="628" y="166" fill="#111111" font-size="12" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">Allow PDF in the policy</text>
      <text x="628" y="181" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">sed -i … policy.xml</text>

      <!-- Decision 2 -->
      <polygon points="328,280 428,328 328,376 228,328" fill="#ffffff" stroke="#111111" stroke-width="1"/>
      <text x="328" y="326" fill="#111111" font-size="11" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">Ghostscript</text>
      <text x="328" y="340" fill="#111111" font-size="11" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">installed?</text>

      <!-- Fix 2: Ghostscript (focal, the missing step) -->
      <rect x="528" y="304" width="200" height="48" rx="6" fill="#fafaf7"/>
      <rect x="528" y="304" width="200" height="48" rx="6" fill="rgba(0,112,243,0.08)" stroke="#0070f3" stroke-width="1"/>
      <text x="628" y="326" fill="#111111" font-size="12" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">Install Ghostscript</text>
      <text x="628" y="341" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">sudo apt install ghostscript</text>

      <!-- End oval -->
      <rect x="248" y="440" width="160" height="48" rx="24" fill="#fafaf7"/>
      <rect x="248" y="440" width="160" height="48" rx="24" fill="rgba(17,17,17,0.03)" stroke="rgba(17,17,17,0.30)" stroke-width="1"/>
      <text x="328" y="462" fill="#111111" font-size="12" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">convert succeeds</text>
      <text x="328" y="477" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">thumbnail.jpg</text>

      <!-- Legend -->
      <line x1="40" y1="504" x2="920" y2="504" stroke="rgba(17,17,17,0.10)" stroke-width="0.8"/>
      <text x="40" y="520" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>
      <rect x="40" y="536" width="24" height="12" rx="6" fill="rgba(17,17,17,0.03)" stroke="rgba(17,17,17,0.30)" stroke-width="1"/>
      <text x="72" y="546" fill="#4b5563" font-size="8.5" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">Start / end (oval)</text>
      <rect x="200" y="536" width="24" height="12" rx="2" fill="#ffffff" stroke="#111111" stroke-width="1"/>
      <text x="232" y="546" fill="#4b5563" font-size="8.5" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">Fix (rectangle)</text>
      <polygon points="352,542 364,536 376,542 364,548" fill="#ffffff" stroke="#111111" stroke-width="1"/>
      <text x="388" y="546" fill="#4b5563" font-size="8.5" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">Check (diamond)</text>
      <circle cx="516" cy="542" r="4" fill="#111111"/>
      <text x="528" y="546" fill="#4b5563" font-size="8.5" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">Retry point</text>
      <rect x="616" y="536" width="24" height="12" rx="2" fill="rgba(0,112,243,0.08)" stroke="#0070f3" stroke-width="1"/>
      <text x="648" y="546" fill="#4b5563" font-size="8.5" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">The missing step</text>
      <line x1="768" y1="542" x2="796" y2="542" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="804" y="546" fill="#4b5563" font-size="8.5" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">Branch</text>
    </svg>
  </div>
</body>
</html>
