<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One model, three steps, one save</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #fafaf7;
      --color-ink:     #111111;
      --color-muted:   #4b5563;
      --color-accent:  #0070f3;
      --font-sans:     'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      --font-serif:    'Instrument Serif', Georgia, 'Times New Roman', serif;
      --font-mono:     'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · Diagram Design</p>
    <h1>One model, three steps, one save</h1>

    <svg viewBox="0 0 960 248" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="multi-step-forms-wizards-in-rails-title multi-step-forms-wizards-in-rails-desc">
      <title id="multi-step-forms-wizards-in-rails-title">One model, three steps, one save</title>
      <desc id="multi-step-forms-wizards-in-rails-desc">State machine of a cache-backed Rails wizard: three step states each validate their own fields, a valid step writes the attributes to the cache and moves to the next step, an invalid step re-renders with errors, and the last valid step saves the House row and deletes the cache.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b5563"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0070f3"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b5563"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafaf7"/>

      <!-- Transitions, drawn first. States sit at y 88 to 152, mid 120 -->
      <line x1="54" y1="120" x2="88" y2="120" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="216" y1="120" x2="300" y2="120" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="428" y1="120" x2="512" y2="120" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="640" y1="120" x2="724" y2="120" stroke="#0070f3" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="852" y1="120" x2="888" y2="120" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Self-loops above each step: invalid input re-renders the same step -->
      <path d="M 128,88 V 72 Q 128,64 136,64 H 168 Q 176,64 176,72 V 88" fill="none" stroke="#4b5563" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <path d="M 340,88 V 72 Q 340,64 348,64 H 380 Q 388,64 388,72 V 88" fill="none" stroke="#4b5563" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <path d="M 552,88 V 72 Q 552,64 560,64 H 592 Q 600,64 600,72 V 88" fill="none" stroke="#4b5563" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- Transition labels, masked, 6px above the stroke -->
      <rect x="60" y="102" width="24" height="12" rx="2" fill="#fafaf7"/>
      <text x="72" y="112" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NEW</text>

      <rect x="220" y="102" width="76" height="12" rx="2" fill="#fafaf7"/>
      <text x="258" y="112" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VALID / CACHE</text>

      <rect x="432" y="102" width="76" height="12" rx="2" fill="#fafaf7"/>
      <text x="470" y="112" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VALID / CACHE</text>

      <rect x="644" y="102" width="72" height="12" rx="2" fill="#fafaf7"/>
      <text x="680" y="112" fill="#0070f3" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VALID / SAVE</text>

      <rect x="856" y="102" width="28" height="12" rx="2" fill="#fafaf7"/>
      <text x="870" y="112" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SHOW</text>

      <rect x="112" y="46" width="80" height="12" rx="2" fill="#fafaf7"/>
      <text x="152" y="56" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INVALID / 422</text>

      <rect x="324" y="46" width="80" height="12" rx="2" fill="#fafaf7"/>
      <text x="364" y="56" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INVALID / 422</text>

      <rect x="536" y="46" width="80" height="12" rx="2" fill="#fafaf7"/>
      <text x="576" y="56" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INVALID / 422</text>

      <!-- Start dot -->
      <circle cx="48" cy="120" r="6" fill="#111111"/>

      <!-- State: address_info -->
      <rect x="88" y="88" width="128" height="64" rx="8" fill="#fafaf7"/>
      <rect x="88" y="88" width="128" height="64" rx="8" fill="#ffffff" stroke="#111111" stroke-width="1"/>
      <rect x="96" y="96" width="36" height="12" rx="2" fill="transparent" stroke="rgba(17,17,17,0.40)" stroke-width="0.8"/>
      <text x="114" y="105" fill="#4b5563" font-size="7" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STEP 1</text>
      <text x="152" y="126" fill="#111111" font-size="12" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">Address info</text>
      <text x="152" y="141" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">address · last_name</text>

      <!-- State: house_info -->
      <rect x="300" y="88" width="128" height="64" rx="8" fill="#fafaf7"/>
      <rect x="300" y="88" width="128" height="64" rx="8" fill="#ffffff" stroke="#111111" stroke-width="1"/>
      <rect x="308" y="96" width="36" height="12" rx="2" fill="transparent" stroke="rgba(17,17,17,0.40)" stroke-width="0.8"/>
      <text x="326" y="105" fill="#4b5563" font-size="7" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STEP 2</text>
      <text x="364" y="126" fill="#111111" font-size="12" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">House info</text>
      <text x="364" y="141" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">interior · exterior</text>

      <!-- State: house_stats -->
      <rect x="512" y="88" width="128" height="64" rx="8" fill="#fafaf7"/>
      <rect x="512" y="88" width="128" height="64" rx="8" fill="#ffffff" stroke="#111111" stroke-width="1"/>
      <rect x="520" y="96" width="36" height="12" rx="2" fill="transparent" stroke="rgba(17,17,17,0.40)" stroke-width="0.8"/>
      <text x="538" y="105" fill="#4b5563" font-size="7" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STEP 3</text>
      <text x="576" y="126" fill="#111111" font-size="12" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">House stats</text>
      <text x="576" y="141" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">rooms · square_feet</text>

      <!-- State: House saved (focal, terminal) -->
      <rect x="724" y="88" width="128" height="64" rx="8" fill="#fafaf7"/>
      <rect x="724" y="88" width="128" height="64" rx="8" fill="rgba(0,112,243,0.08)" stroke="#0070f3" stroke-width="1"/>
      <rect x="732" y="96" width="28" height="12" rx="2" fill="transparent" stroke="rgba(0,112,243,0.50)" stroke-width="0.8"/>
      <text x="746" y="105" fill="#0070f3" font-size="7" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DONE</text>
      <text x="788" y="126" fill="#111111" font-size="12" font-weight="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">House saved</text>
      <text x="788" y="141" fill="#4b5563" font-size="9" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">cache to DB row</text>

      <!-- End ring -->
      <circle cx="896" cy="120" r="8" fill="none" stroke="#111111" stroke-width="1"/>
      <circle cx="896" cy="120" r="5" fill="#111111"/>

      <!-- Legend -->
      <line x1="40" y1="168" x2="920" y2="168" stroke="rgba(17,17,17,0.10)" stroke-width="0.8"/>
      <text x="40" y="184" fill="#4b5563" font-size="8" font-family="'Geist Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="40" y="202" width="14" height="10" rx="2" fill="rgba(0,112,243,0.08)" stroke="#0070f3" stroke-width="1"/>
      <text x="60" y="210" fill="#4b5563" font-size="8.5" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">Saved to the database</text>
      <rect x="180" y="202" width="14" height="10" rx="2" fill="#ffffff" stroke="#111111" stroke-width="1"/>
      <text x="200" y="210" fill="#4b5563" font-size="8.5" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">Step, validates its own fields</text>
      <line x1="372" y1="207" x2="400" y2="207" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="408" y="210" fill="#4b5563" font-size="8.5" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">Valid, attributes cached</text>
      <line x1="548" y1="207" x2="576" y2="207" stroke="#4b5563" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="584" y="210" fill="#4b5563" font-size="8.5" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">Invalid, re-render</text>
      <line x1="696" y1="207" x2="724" y2="207" stroke="#0070f3" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="732" y="210" fill="#4b5563" font-size="8.5" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">Valid, save the row</text>
    </svg>
  </div>
</body>
</html>
